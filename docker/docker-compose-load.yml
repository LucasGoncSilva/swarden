# docker stop $(docker ps -a -q); docker rm $(docker ps -a -q); docker rmi $(docker images -a -q)
# docker compose -f docker/docker-compose-load.yml up

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=CORE.settings.dev
      - DEBUG=False
      - IS_LOG_ON=True
      - ALLOWED_HOSTS=*
      - CRYPTOSEED=just-a-not-so-long-random-string-to-emulate-a-seed
      - CAPTCHA_TEST_MODE=True
      - DATABASE_NAME=postgres
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_HOST=db
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "4GB"

  db:
    image: postgres:alpine
    shm_size: "512mb"
    volumes:
      - ./postgres.loadtest.conf:/etc/postgresql/postgresql.conf:ro
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=postgres pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "2GB"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/static
      # - media_volume:/app/media
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
        reservations:
          cpus: "0.25"
          memory: "64M"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      - web

volumes:
  static_volume:
  media_volume:
