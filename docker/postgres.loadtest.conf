# --- MEMORY SETTINGS ---
# Shared buffers should be 25% of total RAM (2GB * 0.25 = 512MB)
shared_buffers = 512MB
# The amount of memory used by internal sort operations and hash tables 
# before writing to temporary disk files.
work_mem = 4MB
# Used for maintenance operations (VACUUM, CREATE INDEX). 
maintenance_work_mem = 128MB
# Total RAM available for caching (OS + Postgres). 75% is a safe bet.
effective_cache_size = 1536MB

# --- WRITE AHEAD LOG (WAL) & CHECKPOINTS ---
# Controls how much of the checkpoint interval is used for flushing dirty buffers.
checkpoint_completion_target = 0.9
# 1/32 of shared_buffers, capped at 16MB.
wal_buffers = 16MB
# Minimum/Maximum size the WAL can grow to before a checkpoint.
min_wal_size = 1GB
max_wal_size = 4GB

# --- QUERY PLANNER ---
# Default is 4.0 (HDD). Set to 1.1 for SSDs to encourage index usage.
random_page_cost = 1.1
# How many simultaneous requests the drive can handle. 200 is good for SSD.
effective_io_concurrency = 200
# The amount of "intelligence" the planner has about your data distribution.
default_statistics_target = 100

# --- CONNECTIONS ---
# On 1 CPU, high connection counts cause massive context-switching overhead.
max_connections = 50
listen_addresses = '*'
