{% extends 'shared/base.html' %}
{% load static %}


{% block title %} Logout {% endblock %}


{% block head %}
<link rel="stylesheet" href="{% static 'account/css/style.css' %}" />
{% endblock %}


{% block body %}
<div class="login-form-container center-confirm">
    <div>
        <img src="{% static 'shared/img/logo.svg' %}" alt="sWarden's logo" />
    </div>

    <form action="{% url 'account:logout' %}" method="post">
        {% csrf_token %}

        <h2>Do you confirm exiting?</h2>

        <input type="submit" autofocus value="Exit" class="btn btn-outline" />

        <button type="button" class="btn btn-primary history-back">
            Go back
        </button>
    </form>
</div>
{% endblock %}
