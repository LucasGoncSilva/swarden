{% extends 'shared/base.html' %}
{% load static %}


{% block title %} Error {{ code }}: {{ message1 }} {% endblock %}


{% block head %}
<link rel="stylesheet" href="{% static 'account/css/style.css' %}" />
{% endblock %}


{% block body %}
<div class="center-confirm login-form-container">
    <img src="{% static 'shared/img/logo.svg' %}" alt="sWarden's logo" />
    <h1>Identified error:</h1>

    <br><br>

    <h2>{{ message1 }}</h2>
    <h3>{{ message2 }}</h3>
    <h6>status code: {{ code }}</h6>

    <br><br>

    <a href="{% url 'home:index' %}" class="btn btn-outline">Home</a>

    <button type="button" class="btn btn-primary history-back">
        Go back
    </button>
</div>
{% endblock %}
